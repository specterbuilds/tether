name: release
on:
  push:
    branches: [main]
permissions:
  contents: write
  pull-requests: write
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npm test
      - name: Create release PR or publish
        uses: changesets/action@v1
        with:
          version: npm run version-packages
          # publish is disabled until an npm token is configured; the
          # action still opens the "Version Packages" PR with changelogs.
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
